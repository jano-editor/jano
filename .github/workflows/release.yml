name: Release

on:
  push:
    tags:
      - "plugin-types-v*"
      - "ui-v*"
      - "editor-v*"
  # dry run: everything an editor release does, without publishing anything
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"
      - "packages/*/package.json"
  workflow_dispatch:

env:
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  release:
    name: Publish
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write
      id-token: write

    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
      is_editor: ${{ steps.pkg.outputs.is_editor }}
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine package from tag
        id: pkg
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            # pretend to release the current editor version
            TAG="editor-v$(node -p "require('./packages/editor/package.json').version")"
            echo "Dry run as $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" =~ ^plugin-types-v(.+)$ ]]; then
            echo "dir=packages/plugin-types" >> $GITHUB_OUTPUT
            echo "name=@jano-editor/plugin-types" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "filter=@jano-editor/plugin-types" >> $GITHUB_OUTPUT
            echo "is_editor=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^ui-v(.+)$ ]]; then
            echo "dir=packages/ui" >> $GITHUB_OUTPUT
            echo "name=@jano-editor/ui" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "filter=@jano-editor/ui" >> $GITHUB_OUTPUT
            echo "is_editor=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^editor-v(.+)$ ]]; then
            echo "dir=packages/editor" >> $GITHUB_OUTPUT
            echo "name=@jano-editor/editor" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "filter=@jano-editor/editor" >> $GITHUB_OUTPUT
            echo "is_editor=true" >> $GITHUB_OUTPUT
          else
            echo "Unknown tag: $TAG"
            exit 1
          fi

      - name: Build
        run: |
          if node -e "const p=require('./${{ steps.pkg.outputs.dir }}/package.json'); process.exit(p.scripts?.build ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ${{ steps.pkg.outputs.filter }} build
          else
            echo "No build script, skipping"
          fi

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --access public --no-git-checks $([[ "$DRY_RUN" == "true" ]] && echo --dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compile linux and windows binaries
        if: steps.pkg.outputs.is_editor == 'true'
        run: |
          mkdir -p bin
          bun build ./packages/editor/dist/cli.js --compile --target=bun-linux-x64 --outfile bin/jano-linux-x64
          bun build ./packages/editor/dist/cli.js --compile --target=bun-linux-arm64 --outfile bin/jano-linux-arm64
          bun build ./packages/editor/dist/cli.js --compile --target=bun-windows-x64 --outfile bin/jano-windows-x64.exe
          # the runner is arm64, so this one can be smoke tested
          ./bin/jano-linux-arm64 --version

      - name: Upload binaries
        if: steps.pkg.outputs.is_editor == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-windows
          path: bin/

      - name: Create GitHub release
        if: steps.pkg.outputs.is_editor != 'true'
        # only editor releases carry binaries, so only they may become "latest"
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}" \
            --generate-notes \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS binaries
    needs: release
    if: needs.release.outputs.is_editor == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # bun --compile bundles runtime deps from node_modules, so a full install is needed here
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jano-editor/editor build

      - name: Compile and sign
        run: |
          mkdir -p bin
          for target in darwin-arm64 darwin-x64; do
            bun build ./packages/editor/dist/cli.js --compile --target=bun-$target --outfile bin/jano-$target
            # macOS kills binaries without a valid signature. an ad-hoc signature is enough
            # for brew and install.sh, since neither sets the quarantine flag.
            codesign --force --sign - bin/jano-$target
            codesign --verify --strict --verbose=2 bin/jano-$target
          done
          ./bin/jano-darwin-arm64 --version
          # intel build via rosetta, if the runner has it
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./bin/jano-darwin-x64 --version
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: bin/

  publish:
    name: GitHub release + Homebrew
    needs: [release, macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: bin
          merge-multiple: true

      - name: Checksums
        working-directory: bin
        run: |
          sha256sum jano-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        run: |
          gh release create "${{ needs.release.outputs.tag }}" bin/* \
            --repo "${{ github.repository }}" \
            --title "${{ needs.release.outputs.name }} ${{ needs.release.outputs.version }}" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          # fails the job if a checksum is missing, an empty sha256 would break brew for every user
          sha() {
            local hash
            hash=$(grep " $1\$" bin/SHA256SUMS | cut -d' ' -f1)
            [[ -n "$hash" ]] || { echo "::error::No checksum for $1" >&2; return 1; }
            echo "$hash"
          }
          SHA_DARWIN_ARM64=$(sha jano-darwin-arm64)
          SHA_DARWIN_X64=$(sha jano-darwin-x64)
          SHA_LINUX_X64=$(sha jano-linux-x64)
          SHA_LINUX_ARM64=$(sha jano-linux-arm64)

          if [[ "$DRY_RUN" == "true" ]]; then
            mkdir -p /tmp/homebrew-jano/Formula
          else
            git clone https://x-access-token:${TAP_TOKEN}@github.com/jano-editor/homebrew-jano.git /tmp/homebrew-jano
          fi

          cat > /tmp/homebrew-jano/Formula/jano.rb << FORMULA
          class Jano < Formula
            desc "Terminal editor with plugin-based syntax highlighting and formatting"
            homepage "https://janoeditor.dev"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/jano-editor/jano/releases/download/editor-v#{version}/jano-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/jano-editor/jano/releases/download/editor-v#{version}/jano-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/jano-editor/jano/releases/download/editor-v#{version}/jano-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
              on_arm do
                url "https://github.com/jano-editor/jano/releases/download/editor-v#{version}/jano-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              binary = stable.url.split("/").last
              bin.install binary => "jano"
            end

            test do
              assert_match "jano v#{version}", shell_output("#{bin}/jano --version")
            end
          end
          FORMULA

          if [[ "$DRY_RUN" == "true" ]]; then
            cat /tmp/homebrew-jano/Formula/jano.rb
            ruby -c /tmp/homebrew-jano/Formula/jano.rb
            exit 0
          fi

          cd /tmp/homebrew-jano
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/jano.rb
          git commit -m "update jano to v${VERSION}"
          git push
